# yamllint disable rule:line-length
blueprint:
  name: Motion-activated light
  description: >-
    Turn a light on when motion is detected and turn it off again after no
    motion has been detected for a configurable wait time.
  domain: automation
  author: Blueprint Collection
  source_url: https://github.com/jpawlowski/ha.blueprint_collection/blob/main/blueprints/automation/ha_blueprint_author/motion_light.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    motion_entity:
      name: Motion sensor
      description: The motion sensor that triggers the light.
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: motion
    light_target:
      name: Light
      description: The light (or lights) to control.
      selector:
        target:
          entity:
            domain: light
    no_motion_wait:
      name: Wait time
      description: >-
        Time to wait after the last detected motion before turning the
        light off again.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

# Restart on renewed motion so the wait timer starts over.
mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"

actions:
  - action: light.turn_on
    target: !input light_target
  - wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        from: "on"
        to: "off"
  - delay:
      seconds: !input no_motion_wait
  - action: light.turn_off
    target: !input light_target
