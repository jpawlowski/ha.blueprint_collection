# Chassis Sync
#
# Pulls the shared development chassis (DevContainer, agent runtime, generic
# scripts and linter configuration) from the upstream integration blueprint,
# which is the leading repository for those files:
#
#   https://github.com/jpawlowski/hacs.integration_blueprint
#
# The exact file list is an explicit allowlist in .github/chassis-manifest.txt.
# Everything blueprint-specific is owned here and never touched by this job.
#
# This workflow belongs to the collection template only. initialize.sh removes
# it, because a blueprint author's own repository syncs from THIS repository
# via .github/workflows/template-sync.yml instead.

name: Chassis Sync

on:
  schedule:
    # Every Monday at 06:00 UTC — one hour before template-sync, so a chassis
    # update lands here before it propagates onward to author repositories.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # Every pull request, deliberately: the check must catch a chassis file being
  # edited here instead of upstream, and which files those are is defined by the
  # manifest — a static paths filter here would drift from it.
  pull_request:

permissions: {}

jobs:
  # On pull requests: fail if a chassis file was edited here instead of upstream.
  check:
    name: Check chassis is in sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify chassis files match upstream
        run: script/chassis-sync --check

  # On schedule/dispatch: open a pull request when upstream has moved on.
  sync:
    name: Sync chassis from upstream
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync chassis files
        run: script/chassis-sync

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Chassis is already up to date — nothing to do."
            exit 0
          fi

          BRANCH="chassis-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(chassis): sync shared development files from upstream" \
                     -m "Synced from jpawlowski/hacs.integration_blueprint according to .github/chassis-manifest.txt."
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Existing pull request updated."
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "chore(chassis): sync shared development files from upstream" \
              --body "Automated sync of the shared development chassis from [jpawlowski/hacs.integration_blueprint](https://github.com/jpawlowski/hacs.integration_blueprint).

          Only files listed in \`.github/chassis-manifest.txt\` are touched — that list is an explicit allowlist, so nothing blueprint-specific can arrive through it.

          Review the diff and run \`script/check\` before merging."
          fi
