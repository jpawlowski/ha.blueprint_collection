---
name: "Bug report"
description: "Report a bug with one of the blueprints"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
  - type: input
    attributes:
      label: "Home Assistant version"
      description: "The version of Home Assistant you are using"
      placeholder: "2025.1.0"
    validations:
      required: true
  - type: input
    attributes:
      label: "Blueprint"
      description: "Which blueprint is affected"
      placeholder: "Motion-activated light"
    validations:
      required: true
  - type: input
    attributes:
      label: "Collection version"
      description: "The release you imported the blueprint from (or the date you last re-imported)"
      placeholder: "1.0.0"
    validations:
      required: false
  - type: textarea
    attributes:
      label: "System Health details"
      description: "Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have re-imported the blueprint to confirm the issue exists in the latest version.
          required: true
        - label: I have attached the automation trace (Settings > Automations > your automation > Traces).
          required: true
        - label: I have filled out the issue template to the best of my ability.
          required: true
        - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
          required: true
        - label: This issue is not a duplicate issue of any [previous issues](https://github.com/jpawlowski/ha.blueprint_collection/issues?q=is%3Aissue+label%3A%22Bug%22+)..
          required: true
  - type: textarea
    attributes:
      label: "Describe the issue"
      description: "A clear and concise description of what the issue is."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Automation trace"
      description: "Go to Settings > Automations > your automation > Traces, click 'Download trace', and drag the file here. This is by far the most useful information for diagnosing a blueprint issue."
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Blueprint configuration"
      description: "The inputs you configured. Settings > Automations > your automation > ⋮ > Edit in YAML, then paste the `use_blueprint` block here."
      render: yaml
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Debug logs"
      description: "Logs from Home Assistant, if relevant. To enable debug logs see https://www.home-assistant.io/integrations/logger/"
      render: text
    validations:
      required: false
